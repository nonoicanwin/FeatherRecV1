
name: Build FeatherRec APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q FeatherRec-Android-Source.zip -d source
          chmod +x source/FeatherRec/gradlew

      - name: Build APK
        working-directory: source/FeatherRec
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FeatherRec-APK
          path: source/FeatherRec/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
